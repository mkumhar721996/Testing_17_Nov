version: 1
components:
  comp_web_app:
    name: Web App
    kind: web_ui
    directory: apps/web
    stack:
      choices:
        styling: tailwindcss
        language: typescript
        framework: react + vite
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: database not applicable — reaches data only through the API
  comp_operations_api:
    name: Operations API
    kind: api_service
    directory: services/operations-api
    stack:
      choices:
        database: postgresql
        language: typescript
        framework: nestjs
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: styling not applicable — API only
  comp_background_worker:
    name: Background Worker
    kind: worker
    directory: services/background-worker
    stack:
      choices:
        language: typescript
        package_manager: pnpm
        testing_tool_unit: vitest
      notes: plain worker; uses the shared PostgreSQL but does not own it; no external
        surface for e2e
  comp_relational_database:
    name: Relational Database
    kind: infrastructure
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS
  comp_identity_provider:
    name: Identity Provider
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon Cognito
